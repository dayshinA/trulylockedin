allowBuilds:
  sharp: false
  unrs-resolver: false
  "@firebase/util": false
  protobufjs: false
  esbuild: false

# Security patches for transitive dependencies (pnpm audit, 2026-11-05).
# firebase pins grpc-js ~1.9 for client Firestore, which this app never loads;
# glob 14 is the patched line for glob/minimatch pulled in via firebase-admin
# and react-email.
overrides:
  "@grpc/grpc-js": ">=1.14.6"
  glob: ">=14.0.2"
  # jose 6 is ESM-only; jwks-rsa (firebase-admin/auth) require()s it, which
  # fails on Vercel's runtime. jose 5 ships a CommonJS build with the same API.
  "jwks-rsa>jose": "5.10.0"
